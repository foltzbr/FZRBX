name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check popup.js && node --check content.js
      - run: python3 -m json.tool manifest.json > /dev/null && echo "manifest ok"
